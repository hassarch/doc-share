name: Backend CI

# Native path filtering (per ADR-0002's consequences) - this workflow only
# runs when backend/ actually changed, so a frontend-only PR doesn't wait
# on a Gradle build.
on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-unit-tests:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('backend/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Spotless check (formatting)
        run: ./gradlew spotlessCheck

      - name: Unit tests
        run: ./gradlew test

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-results
          path: backend/build/reports/tests/test

  integration-tests:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    # ubuntu-latest runners have Docker preinstalled, which is all
    # Testcontainers needs - no separate service containers to configure
    # in this workflow; Postgres/Redis/MinIO/Kafka all start as part of
    # the test run itself, via AbstractPostgresIntegrationTest.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('backend/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Integration tests
        run: ./gradlew integrationTest

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-results
          path: backend/build/reports/tests/integrationTest

  docker-build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    # Only on main, and only after both test jobs pass - a PR proves the
    # image builds correctly via this same Dockerfile locally if needed,
    # but doesn't need to push anything anywhere.
    if: github.ref == 'refs/heads/main'
    needs: [lint-and-unit-tests, integration-tests]
    permissions:
      contents: read
      packages: write # needed to push to GitHub Container Registry
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/docshare-backend:latest
            ghcr.io/${{ github.repository_owner }}/docshare-backend:${{ github.sha }}
