name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  lint-typecheck-build:
    name: Lint + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src/

      - name: Build
        # NEXT_PUBLIC_API_BASE_URL isn't set here - Next.js inlines
        # NEXT_PUBLIC_* vars at build time, but api.ts falls back to
        # http://localhost:8080 when it's unset, so the build succeeds
        # without needing a real value for CI's purposes (this build is
        # only proving compilation, not being deployed).
        run: npm run build
