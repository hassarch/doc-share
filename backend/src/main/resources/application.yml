spring:
  application:
    name: docshare-backend
  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:docshare}
    username: ${DB_USER:docshare}
    password: ${DB_PASSWORD:docshare}
  jpa:
    hibernate:
      # Schema changes go through Flyway migrations, not Hibernate auto-DDL —
      # "validate" catches drift between entities and the actual schema
      # instead of silently patching it.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

docshare:
  jwt:
    secret: ${JWT_SECRET:change-me-in-every-environment-this-is-a-local-dev-only-default}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
  password-reset:
    token-ttl-minutes: 30
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:docshare}
      secret-key: ${MINIO_SECRET_KEY:docshare123}
    chunk-threshold-mb: 50
    chunk-size-mb: 5

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] %-5level %logger{36} - %msg%n"
