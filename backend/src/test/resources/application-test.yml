# Used only by the plain context-loading smoke test (BackendApplicationTests).
# It verifies Spring wiring, not real infrastructure — so DB/Redis/Kafka
# autoconfiguration is excluded here to keep it fast and dependency-free.
#
# Real integration tests (added from the Database phase onward) use
# Testcontainers instead of this profile, so they exercise the real
# Postgres/Redis/Kafka behavior rather than skipping it.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
